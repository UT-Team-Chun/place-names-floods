# 多言語・水文地形形態素辞書（N-lex）— protocol v2 の主チャネルの一つ
#
# 状態: FROZEN（protocol v2 と同時に凍結、2026-10-26。sha256 は preregistration_v2.md §10。
#       凍結後の変更は amendment で、新版の辞書は副解析にしか使わない）
# 作成: 2026-10-25、Claude Opus 5.5（LLM）が一般的な地名学・語彙知識のみから編集。
#       本研究の地名・ラベル・イベントデータは一切参照していない（全球データは
#       この時点でモデル fit・相関とも未計算）。固有名・河川名は入れない。
# 照合: GeoNames asciiname を小文字化・英字以外で分割したトークンに、地名の国（cc）に
#       対応する言語の項目だけを適用（topsem.world.lexicon）。
#       word = トークン一致 / prefix・suffix = 残り 2 文字以上 / infix = 4 文字以上の form のみ。
# 方針: 誤爆の多い短い形・人名や方角と衝突する形は入れない（再現率より精度を優先）。
#       例: 英 "-ey"（-ley と衝突）、越 "ho"/"dong"（姓・東と衝突）、中 "he"/"hu" は除外。
#
# カテゴリ:
#   water    — 流水・止水・泉・井戸（川・小川・湖・池・泉）
#   wet      — 湿地・沼沢・泥・葦原・湿った草地
#   riverine — 中州・河畔草地・氾濫原・河岸・砂州・干拓/堤防地
#   crossing — 渡河点・橋・渡し・船着き場・河港
#   low      — 谷・低地・窪地・「下の」
#   high     — 丘・山・高み・岩・「上の」

