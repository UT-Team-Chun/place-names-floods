[project]
name = "topsem"
version = "0.1.0"
description = "地名の環境記憶と洪水ハザード評価の解析ロジック（corpus / labels / covariates / features / splits / models / evaluation）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.8",
]
models = [
    "scikit-learn>=1.4",
]
# v2 全球検定（Copernicus EMS ラベル・GLO-30/HAND・GeoNames）用の地理空間スタック
world = [
    "rasterio>=1.4",
    "pyproj>=3.6",
    "pyarrow>=17.0",
    "pyogrio>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "pyarrow>=17.0",
    "pyogrio>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["topsem"]

[tool.hatch.build.targets.wheel.force-include]
"topsem/py.typed" = "topsem/py.typed"

[tool.mypy]
plugins = "pydantic.mypy"
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Missing trailing comma (conflicts with formatter)
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D106",   # Missing docstring in public nested class
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D400",   # First line should end with a period
    "D403",   # First word of the docstring should be properly capitalized
    "D415",   # First line should end with a period, question mark, or exclamation point
    "CPY001", # 著作権ヘッダは本リポの運用に合わない
    "TC001",  # 実行時にパス解決へ使う import まで型チェック化させない
    "TC002",  # Move third-party import into a type-checking block
    "TC003",  # 同上（標準ライブラリ）
    "S607",   # git 等の標準的実行ファイルを相対名で呼ぶ（PATH 解決前提）
    "TRY003", # 簡潔な custom exception クラスより分かりやすい組み込み例外を使う
    "RUF001", # 日本語ドキュメントでは全角記号が「紛らわしい Unicode」に該当する
    "RUF002", # 同上（docstring）
    "RUF003", # Checks for ambiguous Unicode characters in comments
]

[tool.ruff.lint.isort]
# --config で呼んでも src 自動検出に依存しないよう明示（make lint と一致させる）
known-first-party = ["topsem", "gateways"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**/*.py" = ["S101", "ANN201", "PLR2004", "PLR0913", "SLF001", "T201"]
"**/scripts/**/*.py" = ["E501", "INP001", "S603", "S607", "T201", "PLC0415", "E402"]
# 検証ファイル（一回ものの証拠生成・CLAUDE.md 流儀）: stdout 表印刷と軽い逸脱は許容
"**/verification/**/*.py" = ["E501", "T201", "INP001", "ICN001", "PLR2004", "Q000", "FURB192", "RUF046", "ANN001", "ANN201", "E402"]

[tool.coverage]
source = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
